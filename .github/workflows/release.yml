name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Build the interface
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build the exe
        run: python tools/build_exe.py
      - name: Zip
        shell: pwsh
        run: |
          Copy-Item docs/LISEZ-MOI.txt dist/
          Copy-Item docs/README.txt, THIRD_PARTY_NOTICES.md dist/
          Compress-Archive -Path "dist/Lim.exe", "dist/README.txt", "dist/LISEZ-MOI.txt", "dist/THIRD_PARTY_NOTICES.md" -DestinationPath dist/Lim.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/Lim.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
